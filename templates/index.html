<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodBot AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #fff4e6,
                #fffaf5
            );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .chat-container {

            width: 100%;

            max-width: 900px;

            height: 90vh;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);

            overflow: hidden;

            display: flex;

            flex-direction: column;
        }


        /* ================= HEADER ================= */

        .header {

            background: linear-gradient(
                135deg,
                #ea580c,
                #f97316
            );

            color: white;

            padding: 22px;

            display: flex;

            align-items: center;

            gap: 15px;
        }

        .logo {

            width: 55px;

            height: 55px;

            background: white;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;
        }

        .header-text h1 {

            font-size: 24px;

            margin-bottom: 4px;
        }

        .header-text p {

            font-size: 14px;

            opacity: 0.9;
        }


        /* ================= CHAT ================= */

        .chat-box {

            flex: 1;

            padding: 25px;

            overflow-y: auto;

            background: #fffaf5;
        }

        .message {

            display: flex;

            margin-bottom: 18px;
        }

        .message.user {

            justify-content: flex-end;
        }

        .message.bot {

            justify-content: flex-start;
        }

        .bubble {

            max-width: 75%;

            padding: 13px 17px;

            border-radius: 16px;

            line-height: 1.5;

            font-size: 15px;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .bot .bubble {

            background: #fff0df;

            color: #542b12;

            border-bottom-left-radius: 4px;
        }

        .user .bubble {

            background: #ea580c;

            color: white;

            border-bottom-right-radius: 4px;
        }


        /* ================= WELCOME ================= */

        .welcome {

            text-align: center;

            padding: 30px 15px;
        }

        .welcome-icon {

            font-size: 55px;

            margin-bottom: 12px;
        }

        .welcome h2 {

            color: #ea580c;

            margin-bottom: 10px;
        }

        .welcome p {

            color: #555;

            font-size: 14px;

            line-height: 1.6;
        }


        /* ================= SUGGESTIONS ================= */

        .suggestions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            justify-content: center;

            margin-top: 20px;
        }

        .suggestion {

            border: 1px solid #f5b183;

            background: white;

            color: #ea580c;

            padding: 10px 14px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 13px;

            transition: 0.2s;
        }

        .suggestion:hover {

            background: #ea580c;

            color: white;

            transform: translateY(-2px);
        }


        /* ================= TYPING ================= */

        .typing {

            display: none;

            margin-bottom: 15px;
        }

        .typing .bubble {

            background: #fff0df;

            padding: 12px 17px;
        }

        .dot {

            display: inline-block;

            width: 7px;

            height: 7px;

            background: #ea580c;

            border-radius: 50%;

            margin: 0 2px;

            animation: blink 1.2s infinite;
        }

        .dot:nth-child(2) {

            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {

            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0.3;
            }

            40% {
                opacity: 1;
            }
        }


        /* ================= INPUT ================= */

        .input-area {

            padding: 16px;

            background: white;

            border-top: 1px solid #ddd;

            display: flex;

            gap: 10px;
        }

        #messageInput {

            flex: 1;

            border: 1px solid #ccc;

            border-radius: 25px;

            padding: 13px 18px;

            font-size: 15px;

            outline: none;
        }

        #messageInput:focus {

            border-color: #ea580c;

            box-shadow:
                0 0 0 2px
                rgba(234, 88, 12, 0.1);
        }

        #sendButton {

            width: 50px;

            height: 50px;

            border: none;

            border-radius: 50%;

            background: #ea580c;

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        #sendButton:hover {

            transform: scale(1.05);

            background: #c2410c;
        }

        #sendButton:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {

                padding: 0;
            }

            .chat-container {

                height: 100vh;

                border-radius: 0;
            }

            .header {

                padding: 16px;
            }

            .logo {

                width: 48px;

                height: 48px;

                font-size: 25px;
            }

            .header-text h1 {

                font-size: 20px;
            }

            .header-text p {

                font-size: 12px;
            }

            .chat-box {

                padding: 15px;
            }

            .bubble {

                max-width: 85%;
            }

            .suggestions {

                justify-content: flex-start;
            }

            .suggestion {

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <div class="chat-container">


        <!-- ================= HEADER ================= -->

        <div class="header">

            <div class="logo">
                🍳
            </div>

            <div class="header-text">

                <h1>
                    FoodBot AI
                </h1>

                <p>
                    Your Smart Food & Cooking Assistant
                </p>

            </div>

        </div>


        <!-- ================= CHAT AREA ================= -->

        <div
            class="chat-box"
            id="chatBox"
        >


            <!-- WELCOME -->

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-icon">
                    👨‍🍳
                </div>

                <h2>
                    Welcome to FoodBot AI
                </h2>

                <p>
                    Ask me about recipes, cooking,
                    ingredients, food ideas, meal planning
                    and more.
                </p>


                <!-- ================= SUGGESTIONS ================= -->

                <div class="suggestions">


                    <button
                        class="suggestion"
                        type="button"
                        onclick="useSuggestion('How to make South Indian dosa?')"
                    >
                        🥞 Dosa
                    </button>


                    <button
                        class="suggestion"
                        type="button"
                        onclick="useSuggestion('Suggest a simple vegetarian dinner recipe')"
                    >
                        🥗 Dinner
                    </button>


                    <button
                        class="suggestion"
                        type="button"
                        onclick="useSuggestion('How to make a simple chocolate cake?')"
                    >
                        🍰 Baking
                    </button>


                    <button
                        class="suggestion"
                        type="button"
                        onclick="useSuggestion('Suggest some easy snacks to make at home')"
                    >
                        🍿 Snacks
                    </button>


                </div>

            </div>


            <!-- ================= TYPING ================= -->

            <div
                class="message bot typing"
                id="typing"
            >

                <div class="bubble">

                    <span class="dot"></span>

                    <span class="dot"></span>

                    <span class="dot"></span>

                </div>

            </div>


        </div>


        <!-- ================= INPUT ================= -->

        <div class="input-area">


            <input
                type="text"
                id="messageInput"
                placeholder="Ask your food or cooking question..."
                autocomplete="off"
            >


            <button
                id="sendButton"
                type="button"
            >
                ➤
            </button>


        </div>


    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        const chatBox =
            document.getElementById("chatBox");

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const typing =
            document.getElementById("typing");

        const welcome =
            document.getElementById("welcome");


        /* ================= ADD MESSAGE ================= */

        function addMessage(text, sender) {

            const message =
                document.createElement("div");

            message.className =
                "message " + sender;


            const bubble =
                document.createElement("div");

            bubble.className =
                "bubble";


            bubble.textContent =
                text;


            message.appendChild(bubble);


            chatBox.insertBefore(
                message,
                typing
            );


            chatBox.scrollTop =
                chatBox.scrollHeight;
        }


        /* ================= SUGGESTION ================= */

        function useSuggestion(text) {

            messageInput.value =
                text;

            sendMessage();
        }


        /* ================= SEND MESSAGE ================= */

        async function sendMessage() {

            const message =
                messageInput.value.trim();


            if (!message) {

                return;
            }


            /* Hide welcome */

            if (welcome) {

                welcome.style.display =
                    "none";
            }


            /* Add user message */

            addMessage(
                message,
                "user"
            );


            /* Clear input */

            messageInput.value =
                "";


            /* Disable send button */

            sendButton.disabled =
                true;


            /* Show typing */

            typing.style.display =
                "flex";


            chatBox.scrollTop =
                chatBox.scrollHeight;


            try {


                const response =
                    await fetch(
                        "/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message: message
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server error: " +
                        response.status
                    );
                }


                const data =
                    await response.json();


                /* Hide typing */

                typing.style.display =
                    "none";


                /* Show bot answer */

                if (data.reply) {

                    addMessage(
                        data.reply,
                        "bot"
                    );

                } else {

                    addMessage(
                        "Sorry, I could not understand your question.",
                        "bot"
                    );
                }


            } catch (error) {

                console.error(
                    "Chat Error:",
                    error
                );


                typing.style.display =
                    "none";


                addMessage(
                    "Unable to connect to the server. Please make sure app.py is running.",
                    "bot"
                );


            } finally {

                sendButton.disabled =
                    false;

                messageInput.focus();
            }

        }


        /* ================= SEND BUTTON ================= */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        /* ================= ENTER KEY ================= */

        messageInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendMessage();
                }

            }
        );


        /* ================= AUTO FOCUS ================= */

        window.addEventListener(
            "load",
            function() {

                messageInput.focus();

            }
        );


    </script>


</body>

</html>
